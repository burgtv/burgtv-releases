name: Update version.json on Release

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: |
          # Get tag name (e.g., v1.1.10)
          TAG="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION_NAME="${TAG#v}"
          # Get changelog from release body (first 200 chars, single line)
          CHANGELOG=$(echo "${{ github.event.release.body }}" | head -c 200 | tr '\n' ' ' | sed 's/"/\\"/g')

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Find APK asset URL
        id: apk
        run: |
          # Get the APK download URL from release assets
          # Dalla 1.3.7 la release ha anche gli APK per architettura (burgtv-<v>-arm64-v8a-release.apk,
          # burgtv-<v>-armeabi-v7a-release.apk): download_url resta l'APK UNIVERSALE
          # (burgtv-<v>-release.apk), l'unico che leggono le versioni fino alla 1.3.6
          ASSETS='${{ toJson(github.event.release.assets) }}'
          echo "$ASSETS" > /tmp/assets.json
          APK_URL=$(jq -r '.[] | select(.name | test("^burgtv-[0-9.]+-release\\.apk$")) | .browser_download_url' /tmp/assets.json | head -1)
          if [ -z "$APK_URL" ]; then
            APK_URL=$(jq -r '.[] | select((.name | endswith(".apk")) and (.name | test("arm64-v8a|armeabi-v7a|-play") | not)) | .browser_download_url' /tmp/assets.json | head -1)
          fi
          if [ -z "$APK_URL" ]; then
            # Fallback to standard naming
            APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/app-release.apk"
          fi
          echo "url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Read versionCode from APK
        id: vcode
        run: |
          # Download APK temporarily to read true versionCode (avoids bug when
          # version_name has 2-digit patch like 1.1.10 — splitting by '.' gives 10 not 120)
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt
          curl -sL -o /tmp/app.apk "${{ steps.apk.outputs.url }}"
          VERSION_CODE=$(aapt dump badging /tmp/app.apk | grep -oP "versionCode='\K[0-9]+")
          if [ -z "$VERSION_CODE" ]; then
            echo "Error: couldn't read versionCode from APK"
            exit 1
          fi
          echo "Extracted versionCode: $VERSION_CODE"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          # SHA-256 dell'APK: dalla 1.2.12 l'app verifica l'integrita' del download prima di installare
          SHA256=$(sha256sum /tmp/app.apk | cut -d' ' -f1)
          echo "Extracted sha256: $SHA256"
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: APK per architettura
        run: |
          # "downloads": ABI -> {url, sha256}; la 1.3.7+ sceglie l'APK della propria architettura
          # (Build.SUPPORTED_ABIS) e verifica l'impronta; senza split resta {} (si usa l'universale)
          echo '{}' > /tmp/downloads.json
          for ABI in arm64-v8a armeabi-v7a; do
            URL=$(jq -r --arg abi "$ABI" '.[] | select(.name | endswith("-" + $abi + "-release.apk")) | .browser_download_url' /tmp/assets.json | head -1)
            [ -z "$URL" ] && continue
            curl -sL -o /tmp/split.apk "$URL"
            SUM=$(sha256sum /tmp/split.apk | cut -d' ' -f1)
            jq --arg abi "$ABI" --arg url "$URL" --arg sha "$SUM" '. + {($abi): {url: $url, sha256: $sha}}' /tmp/downloads.json > /tmp/d.json && mv /tmp/d.json /tmp/downloads.json
          done
          cat /tmp/downloads.json

      - name: Update version.json
        run: |
          cat > version.json << 'EOF'
          {
              "version_code": ${{ steps.vcode.outputs.version_code }},
              "version_name": "${{ steps.version.outputs.version_name }}",
              "download_url": "${{ steps.apk.outputs.url }}",
              "sha256": "${{ steps.vcode.outputs.sha256 }}",
              "changelog": "${{ steps.version.outputs.changelog }}",
              "mandatory": false,
              "min_version_code": 1
          }
          EOF

          # Pretty print the JSON
          cat version.json | jq '.' > version_temp.json && mv version_temp.json version.json

          if [ "$(jq 'length' /tmp/downloads.json)" -gt 0 ]; then
            jq --slurpfile d /tmp/downloads.json '. + {downloads: $d[0]}' version.json > version_temp.json && mv version_temp.json version.json
          fi

          # Novita' per lingua (dalla 1.3.5 l'app mostra il testo nella sua lingua, ripiego su
          # "changelog"): se c'e' changelog_i18n.json lo si unisce a version.json
          if [ -f changelog_i18n.json ]; then
            jq --slurpfile i18n changelog_i18n.json '. + {changelog_i18n: $i18n[0]}' version.json > version_temp.json && mv version_temp.json version.json
          fi

          echo "Updated version.json:"
          cat version.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json to ${{ steps.version.outputs.version_name }}" || echo "No changes to commit"
          git push
